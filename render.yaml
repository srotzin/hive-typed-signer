services:
  - type: web
    name: hive-typed-signer
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DEMO_SIGNER_SEED_HEX
        sync: false
